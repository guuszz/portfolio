<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Rate Limit Regression — resumo local de testes</title>
<desc id="desc">Ilustração de um resumo real da suíte local: seis testes aprovados, execução limitada a loopback e nenhum destino externo.</desc>
<rect width="1200" height="750" rx="28" fill="#0b100d"/><rect x="36" y="36" width="1128" height="678" rx="22" fill="#111914" stroke="#2d3a30" stroke-width="2"/>
<circle cx="78" cy="82" r="9" fill="#fb7185"/><circle cx="108" cy="82" r="9" fill="#fbbf24"/><circle cx="138" cy="82" r="9" fill="#a3e635"/><text x="178" y="90" fill="#aab7aa" font-family="Consolas,monospace" font-size="22">local test report / loopback only</text>
<text x="82" y="175" fill="#a3e635" font-family="Arial,sans-serif" font-size="42" font-weight="700">Rate Limit Regression</text>
<text x="82" y="218" fill="#c5d0c6" font-family="Arial,sans-serif" font-size="24">Controles de tentativas em uma API de demonstração</text>
<rect x="82" y="270" width="1036" height="326" rx="16" fill="#080c09" stroke="#29332b"/>
<text x="116" y="326" fill="#b7c5b8" font-family="Consolas,monospace" font-size="18">PS&gt; $env:PYTHONPATH='src'; python -m unittest discover -s tests -v</text>
<text x="116" y="382" fill="#d6e1d7" font-family="Consolas,monospace" font-size="21">checks: policy · recovery · identity · redirect · safety caps</text>
<text x="116" y="432" fill="#a3e635" font-family="Consolas,monospace" font-size="22">Ran 6 tests in 2.150s</text>
<text x="116" y="476" fill="#a3e635" font-family="Consolas,monospace" font-size="22">OK</text>
<rect x="82" y="625" width="246" height="48" rx="12" fill="#1d2b1f"/><text x="106" y="657" fill="#b8ef76" font-family="Arial,sans-serif" font-size="20" font-weight="700">6 / 6 testes aprovados</text>
<text x="360" y="657" fill="#c5d0c6" font-family="Arial,sans-serif" font-size="20">fixtures sintéticas · sem tráfego externo</text>
</svg>